name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # pnpm 11 butuh Node >= 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      # Termasuk test privasi: gagal jika core memakai jaringan atau file system
      - run: pnpm test
      # Paket hasil pack harus bisa dipasang dan dipakai (ESM dan CJS)
      - run: node scripts/smoke-paket.mjs
      # Pemantau halaman template DJP (tools/watch-djp)
      - run: node --test tools/watch-djp/lib.test.mjs

  # engines paket menjanjikan Node >= 20, jadi test dijalankan juga di sana.
  # pnpm tidak bisa jalan di Node 20, jadi install dan build di Node 24, test lewat vitest langsung.
  node-lama:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node ../../node_modules/vitest/vitest.mjs run
        working-directory: packages/core
      - run: node ../../node_modules/vitest/vitest.mjs run
        working-directory: packages/cli
