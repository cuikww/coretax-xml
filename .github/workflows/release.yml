name: Release
on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    # Gerbang 1 (docs/PRD.md#roadmap): rilis hanya jalan setelah variabel repo RILIS_NPM = true diset
    # (Settings > Secrets and variables > Actions > Variables), yaitu setelah XML lolos impor Coretax.
    if: vars.RILIS_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit versi + tag
      pull-requests: write # PR "Version Packages"
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Pertukaran token OIDC dilakukan npm CLI (>= 11.5.1)
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Setelah PR versi di-merge: publish lewat trusted publishing, tanpa token npm.
      # Trusted Publisher harus aktif di npmjs.com untuk @coretax-xml/core dan @coretax-xml/cli (repo cuikww/coretax-xml, workflow release.yml).
      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release && git push --tags
        env:
          NPM_CONFIG_PROVENANCE: 'true'
